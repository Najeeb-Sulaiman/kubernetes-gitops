apiVersion: apps/v1
kind: Deployment

metadata:
  name: customer-event-processor

spec:
  replicas: 2

  selector:
    matchLabels:
      app: customer-event-processor

  template:
    metadata:
      labels:
        app: customer-event-processor

    spec:
      containers:
        - name: processor
          image: customer-event-processor:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"
